{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d4a8f">
    <meta name="description" content="Library catalogue">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'books/css/library.css' %}">
    <title>{% block title %}Library{% endblock %}</title>
</head>
<body class="d-flex flex-column min-vh-100">

<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
    <div class="container">
        <div class="site-header__inner">
            <a href="{% url 'books_list' %}" class="brand" aria-label="Home">
                <span class="brand-mark" aria-hidden="true">L</span>
                <span class="brand-text">
                    <span class="brand-title">Library</span>
                    <span class="brand-subtitle">Digital book catalogue</span>
                </span>
            </a>
        </div>
    </div>
</header>

<nav class="main-navbar" aria-label="Main">
    <div class="container">
        <ul class="main-nav">
            <li><a href="{% url 'books_list' %}">All books</a></li>
        </ul>
    </div>
</nav>

<main id="main-content" class="flex-grow-1">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="container">
        <div class="site-footer__grid">
            <div>
                <div class="site-footer__title">Library</div>
                <p>Books, downloads and reader comments</p>
            </div>
            <div>
                <div class="site-footer__title">Pages</div>
                <p><a href="{% url 'books_list' %}">All books</a></p>
            </div>
        </div>
        <div class="site-footer__bottom">
            <span>© Library</span>
            <span>Free to read</span>
        </div>
    </div>
</footer>

{% block extra_js %}{% endblock %}
</body>
</html>
